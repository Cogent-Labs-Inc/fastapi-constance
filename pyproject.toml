[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fastapi-constance"
version = "0.0.1a2"
description = "Dynamic configuration management for FastAPI, inspired by Django Constance."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"

dependencies = [
    "fastapi>=0.115.0",
    "sqlalchemy>=2.0",
    "sqlmodel>=0.0.16",
    "sqladmin>=0.20.0",
    "redis>=5.0.0",
    "greenlet>=3.0.0",
    "pytest>=7.4.4",
    "pytest-asyncio>=0.23.8"
]

[project.urls]
Homepage = "https://github.com/Cogent-Labs-Inc/fastapi-constance/"
